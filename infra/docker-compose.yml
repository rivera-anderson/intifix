# =============================================================================
# IntiFix — producción en un VPS
#
# Solo Caddy expone puertos (80/443). Todo lo demás vive en la red interna.
# Bases de datos en la nube: Postgres (Aiven/Neon), MongoDB Atlas, Redis Upstash.
# Frontends en Vercel. Ver infra/DEPLOY.md.
#
#   cd infra && cp .env.example .env   # y llenar valores
#   docker compose pull && docker compose up -d
#
# Las imágenes las construye GitHub Actions y las publica en GHCR. Para
# construirlas en el propio VPS: docker compose up -d --build
# =============================================================================

name: intifix

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

  gateway:
    image: ghcr.io/${GHCR_OWNER}/intifix-gateway:${TAG:-latest}
    build:
      context: ../services/gateway
    restart: unless-stopped
    mem_limit: 384m
    environment:
      PORT: "8090"
      MONOLITH_URL: http://monolith:8080
      CHAT_NOTIF_URL: http://chat-notif:8091
      CHAT_NOTIF_WS_URL: ws://chat-notif:8091
      ADMIN_URL: http://admin:8000
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: ${REDIS_SSL:-true}
    depends_on:
      monolith:
        condition: service_healthy
      chat-notif:
        condition: service_started

  monolith:
    image: ghcr.io/${GHCR_OWNER}/intifix-monolith:${TAG:-latest}
    build:
      context: ../services/monolith
    restart: unless-stopped
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: ""
      DB_POSTGRES_HOST: ${DB_POSTGRES_HOST}
      DB_POSTGRES_PORT: ${DB_POSTGRES_PORT:-5432}
      DB_POSTGRES_NAME: ${DB_POSTGRES_NAME}
      DB_POSTGRES_USER: ${DB_POSTGRES_USER}
      DB_POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      DB_POSTGRES_SSLMODE: ${DB_POSTGRES_SSLMODE:-require}
      DB_MONGO_HOST: ${DB_MONGO_HOST}
      DB_MONGO_NAME: ${DB_MONGO_NAME}
      DB_MONGO_USER: ${DB_MONGO_USER}
      DB_MONGO_PASSWORD: ${DB_MONGO_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: ${REDIS_SSL:-true}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      cloudinary_cloud_name: ${CLOUDINARY_CLOUD_NAME:-}
      cloudinary_api_key: ${CLOUDINARY_API_KEY:-}
      cloudinary_api_secret: ${CLOUDINARY_API_SECRET:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGIN_1: https://${DOMAIN}
      CORS_ORIGIN_2: https://www.${DOMAIN}
      CORS_ORIGIN_3: https://admin.${DOMAIN}
      RABBITMQ_URL: ${RABBITMQ_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - monolith_uploads:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # chat-notif-service: chat en tiempo real + notificaciones (microservicio)
  # ---------------------------------------------------------------------------
  chat-notif:
    image: ghcr.io/${GHCR_OWNER}/intifix-chat-notif:${TAG:-latest}
    build:
      context: ../services/chat-notif
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: "8091"
      DB_MONGO_HOST: ${DB_MONGO_HOST}
      DB_MONGO_NAME: ${CHAT_MONGO_DB_NAME}
      DB_MONGO_USER: ${DB_MONGO_USER}
      DB_MONGO_PASSWORD: ${DB_MONGO_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: ${REDIS_SSL:-true}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      MONOLITH_URL: http://monolith:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ORIGIN_1: https://${DOMAIN}
      CORS_ORIGIN_2: https://www.${DOMAIN}
      CORS_ORIGIN_3: https://admin.${DOMAIN}
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # RabbitMQ: eventos entre servicios. Solo red interna, sin puertos públicos.
  # Para usar CloudAMQP en su lugar, pon su URL en RABBITMQ_URL y quita este
  # servicio y los depends_on que lo mencionan.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: intifix
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin:
    image: ghcr.io/${GHCR_OWNER}/intifix-admin-django:${TAG:-latest}
    build:
      context: ../services/admin-django
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DJANGO_SETTINGS_MODULE: intifix_admin.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: admin-api.${DOMAIN},admin,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://admin-api.${DOMAIN},https://admin.${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://admin.${DOMAIN}
      DATABASE_URL: ${ADMIN_DATABASE_URL}
      REDIS_URL: ${ADMIN_REDIS_URL}
      MONGODB_URI: ${ADMIN_MONGODB_URI}
      MONGODB_DB_NAME: ${ADMIN_MONGODB_DB_NAME:-intifix_admin}
      JWT_ALGORITHM: HS256
      JWT_SIGNING_KEY: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://monolith:8080
      USERS_SERVICE_URL: http://monolith:8080
      TECHNICIANS_SERVICE_URL: http://monolith:8080
      SERVICES_SERVICE_URL: http://monolith:8080
      PAYMENTS_SERVICE_URL: http://monolith:8080
      GEO_SERVICE_URL: http://monolith:8080
      CHAT_SERVICE_URL: http://chat-notif:8091
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      LOG_JSON: "True"
    depends_on:
      monolith:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  monolith_uploads:
  rabbitmq_data:

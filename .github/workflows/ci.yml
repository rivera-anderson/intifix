# Revisa que todo compile en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontends:
    name: Frontends (web + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Requiere el package-lock.json de la raíz (se genera con `npm install` en la raíz).
      - run: npm ci
      - run: npm run build

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  monolith:
    name: Monolito (compila)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/monolith
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Los tests de integración necesitan las BD reales; aquí solo se compila.
      - run: mvn -B -DskipTests package

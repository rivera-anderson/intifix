# Construye las imágenes Docker del backend, las publica en GHCR y despliega en el VPS.
#
# El paso de despliegue queda apagado hasta que tengas VPS. Para activarlo:
#   Settings > Secrets and variables > Actions
#     Variables: DEPLOY_ENABLED = true
#     Secrets:   VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (clave privada)
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Imagen ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, monolith, chat-notif, admin-django]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/intifix-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/intifix-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Desplegar en el VPS
    needs: images
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /opt/intifix/infra/scripts/deploy.sh
